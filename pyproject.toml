[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-ai-predictor"
version = "0.1.0"
description = "A data-driven Fantasy Premier League decision-support engine"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "matplotlib>=3.8,<4",
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "pydantic>=2.5,<3",
  "python-dotenv>=1.0,<2",
  "requests>=2.31,<3",
  "scipy>=1.11,<2",
  "scikit-learn==1.9.0",
  "joblib>=1.5,<2",
  "streamlit==1.62.0",
  "plotly>=5.24,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
